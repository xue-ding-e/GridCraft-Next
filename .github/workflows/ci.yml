# GridCraft-Next: read-only validation only; no release, Pages deployment or signing jobs.
# The AGENTS.md quality gate (`cargo xtask ci`: fmt, clippy -D warnings, tests, assets, layers,
# wasm, parity --check) on every pull request and every push to main, so a merge burst can't land
# a red tree that only the next agent session discovers.
name: GridCraft-Next CI

on:
  push:
    branches: [main, 'validation/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: cargo xtask ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies (winit, wgpu, rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers

      - name: Install Rust (1.99.0 + clippy, rustfmt, wasm32)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt \
            --target wasm32-unknown-unknown
          rustup default 1.99.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Quality gate
        run: cargo xtask ci

  windows_tests:
    name: Windows packaging script tests
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test monotonic version policy and source installer contracts
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem packaging/windows -Filter '*.ps1' -Recurse) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $tokens, [ref] $errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          ./packaging/windows/test-version.ps1
      - name: Test real WiX MSI and COM readers before compiling Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = "$env:RUNNER_TEMP\gridcraft-wix-script-tests"
          dotnet tool install --tool-path $tools wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX test-tool installation failed' }
          $env:PATH = $tools + ';' + $env:PATH
          ./packaging/windows/test-msi-database.ps1
      - name: Test Python validation helpers
        shell: pwsh
        run: |
          python --version
          python -m unittest discover -s packaging/windows/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python helper tests failed' }

      - name: Test real MSVC linker capture before compiling Rust
        id: link_probe
        shell: pwsh
        run: |
          ./packaging/windows/select-installed-msvc-sdk.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/gridcraft-probe-selection" -ApplyToProcess
          ./packaging/windows/test-msvc-link-capture.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/gridcraft-link-probe"
      - name: Validate bounded linker-probe diagnostics
        id: probe_safe
        if: ${{ always() }}
        shell: pwsh
        run: |
          python packaging/windows/validate-public-toolchain-evidence.py `
            "$env:RUNNER_TEMP/gridcraft-probe-selection/public" `
            "$env:RUNNER_TEMP/gridcraft-link-probe/public"
          if ($LASTEXITCODE -ne 0) { throw 'Linker-probe evidence is not safe to upload' }
      - name: Preserve synthetic linker-probe diagnostics only
        if: ${{ always() && steps.probe_safe.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-link-probe-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/gridcraft-probe-selection/public/*.json
            ${{ runner.temp }}/gridcraft-link-probe/public/link-probe-summary.json

  windows_package:
    name: Windows native application and installer validation
    # Internal Windows evidence can run alongside Linux; validation_result requires both.
    needs: [windows_tests]
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      GRIDCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record runner and install official build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GITHUB_ACTIONS -or $env:RUNNER_OS -ne 'Windows') { throw 'Hosted Windows CI is required' }
          foreach ($name in 'WINDOWS_CERTIFICATE', 'WINDOWS_CERTIFICATE_PASSWORD', 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE') {
            if ([Environment]::GetEnvironmentVariable($name)) { throw 'This validation job must be unsigned and secret-free' }
          }
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain install failed' }
          rustup default 1.99.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }
          rustc -Vv
          cargo -V
          python --version
          dotnet --info
          dotnet tool install --tool-path "$env:RUNNER_TEMP\gridcraft-wix" wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          "$env:RUNNER_TEMP\gridcraft-wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build real Rust application and internal-validation-only packages
        id: build
        shell: pwsh
        run: |
          if ((wix --version) -notmatch '^5\.0\.2(?:\+|\s|$)') { throw 'Unexpected WiX version' }
          ./packaging/windows/build-with-toolchain-evidence.ps1
      - name: Read compiled MSI version and upgrade tables
        id: tables
        shell: pwsh
        run: |
          . ./packaging/windows/version.ps1
          $version = Get-GridCraftPackageVersion -ManifestPath ./Cargo.toml
          ./packaging/windows/test-msi-version.ps1 -Msi "dist/release/gridcraft-next-$($version.FullVersion)-windows-x64.msi" -FullVersion $version.FullVersion
      - name: Verify original coexistence, native GUI, upgrades and uninstall
        id: native
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          . ./packaging/windows/version.ps1
          $version = Get-GridCraftPackageVersion -ManifestPath ./Cargo.toml
          $upstream = "$env:RUNNER_TEMP\gridcraft-upstream-test\gridcraft-0.6.1-windows-x64.msi"
          ./packaging/windows/fetch-upstream-test-msi.ps1 -Destination $upstream
          ./packaging/windows/test-package.ps1 `
            -Msi "dist/release/gridcraft-next-$($version.FullVersion)-windows-x64.msi" `
            -PortableZip "dist/release/gridcraft-next-$($version.FullVersion)-windows-x64-portable.zip" `
            -StageDirectory target/windows-package/x64 -FullVersion $version.FullVersion `
            -SourceSha $env:GITHUB_SHA -UpstreamMsi $upstream `
            -EvidenceDirectory "$env:RUNNER_TEMP\gridcraft-next-windows-evidence"
      - name: Validate and isolate public toolchain evidence
        id: toolchain_evidence
        if: ${{ always() }}
        shell: pwsh
        env:
          TOOLCHAIN_CAPTURE_COMPLETE: ${{ steps.build.outputs.toolchain_capture_complete }}
        run: |
          $ErrorActionPreference = 'Stop'
          $upload = "$env:RUNNER_TEMP/gridcraft-next-toolchain-public"
          if (Test-Path -LiteralPath $upload) { throw 'Toolchain upload directory must be new' }
          New-Item -ItemType Directory -Path $upload | Out-Null
          $safe = $true
          foreach ($item in @(@('selection', 'gridcraft-toolchain-selection'), @('links', 'gridcraft-link-capture'), @('toolchain', 'gridcraft-toolchain-collection'))) {
            $public = Join-Path (Join-Path $env:RUNNER_TEMP $item[1]) 'public'
            if (-not (Test-Path -LiteralPath $public -PathType Container)) { $safe = $false; continue }
            python packaging/windows/validate-public-toolchain-evidence.py $public
            if ($LASTEXITCODE -ne 0) { $safe = $false; continue }
            # Only a validated explicit public surface is copied; private logs/env are excluded.
            Copy-Item -LiteralPath $public -Destination (Join-Path $upload $item[0]) -Recurse
          }
          if (-not $safe -or $env:TOOLCHAIN_CAPTURE_COMPLETE -ne 'true') {
            throw 'Toolchain/link evidence is incomplete; independently collected native evidence remains diagnostic only'
          }
      - name: Require every validation layer and reviewed distribution eligibility
        if: ${{ always() }}
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TABLES_OUTCOME: ${{ steps.tables.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain_evidence.outcome }}
        run: |
          foreach ($outcome in $env:BUILD_OUTCOME, $env:TABLES_OUTCOME, $env:NATIVE_OUTCOME, $env:TOOLCHAIN_OUTCOME) {
            if ($outcome -ne 'success') { throw 'A required Windows validation layer failed or did not run' }
          }
          $status = Get-Content target/windows-build-evidence/x64/legal-status.json -Raw | ConvertFrom-Json
          if (-not $status.distribution_approved -or $status.validation_only) {
            throw 'Internal validation evidence only: legal review and a clean distributable rebuild are still required'
          }
      - name: Collect reduced build evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          python packaging/windows/summarize_build.py `
            --build-log target/windows-build-evidence/x64/cargo-build.jsonl `
            --lockfile Cargo.lock --source-sha $env:GITHUB_SHA --target x86_64-pc-windows-msvc `
            --gui target/x86_64-pc-windows-msvc/release/gridcraft.exe `
            --cli target/x86_64-pc-windows-msvc/release/gridcraft-cli.exe `
            --output target/windows-build-evidence/x64/build-summary.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not reduce build evidence safely' }
      # No binaries or installer files are uploaded by this initial validation job.
      # The final deliverable gets a separate reviewed gate after all layers pass.
      - name: Preserve synthetic diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/windows-build-evidence/x64/build-summary.json
            target/windows-build-evidence/x64/legal-status.json
            target/windows-build-evidence/x64/third-party/*.json
            target/windows-build-evidence/x64/third-party/*.txt
            ${{ runner.temp }}/gridcraft-next-windows-evidence/**/*.json
            ${{ runner.temp }}/gridcraft-next-windows-evidence/**/*.log
            ${{ runner.temp }}/gridcraft-next-windows-evidence/**/*.png
            ${{ runner.temp }}/gridcraft-next-windows-evidence/**/*.txt
            ${{ runner.temp }}/gridcraft-next-toolchain-public/**/*.json
            ${{ runner.temp }}/gridcraft-next-toolchain-public/**/legal/*

  validation_result:
    name: Complete source and Windows validation
    if: ${{ always() }}
    needs: [gate, windows_tests, windows_package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed unless every independent job passed
        env:
          LINUX_RESULT: ${{ needs.gate.result }}
          WINDOWS_TEST_RESULT: ${{ needs.windows_tests.result }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows_package.result }}
        run: |
          python3 packaging/windows/check_validation_result.py \
            --linux "$LINUX_RESULT" --windows-tests "$WINDOWS_TEST_RESULT" \
            --windows-native "$WINDOWS_NATIVE_RESULT"
