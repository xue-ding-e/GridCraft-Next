name: Windows installed toolchain helper probe
on:
  push:
    branches: ['diagnostic/windows-toolchain']
permissions:
  contents: read
concurrency:
  group: toolchain-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check script syntax and helper tests
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem packaging/windows -Filter '*.ps1' -Recurse) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw 'PowerShell syntax failure' }
          }
          python -m unittest discover -s packaging/windows/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python helper tests failed' }
      - name: Select already installed MSVC and SDK, then test real linker capture
        shell: pwsh
        run: |
          ./packaging/windows/select-installed-msvc-sdk.ps1 -OutputDirectory "$env:RUNNER_TEMP/selection" -ApplyToProcess
          ./packaging/windows/test-msvc-link-capture.ps1 -OutputDirectory "$env:RUNNER_TEMP/probe"
      - name: Inspect pinned installed toolchain originals without a Rust build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A real Windows regex regression, independent of external compilation.
          $crlf = "release: 1.99.0`r`nLLVM version: 23.1.0`r`n"
          if ($crlf -match '(?m)^release: 1\.99\.0$') { throw 'CRLF regression fixture did not reproduce the old parser failure' }
          if ($crlf -notmatch '(?m)^release: 1\.99\.0\r?$') { throw 'CRLF identity fix failed' }
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned official toolchain installation failed' }
          ./packaging/windows/select-installed-msvc-sdk.ps1 -OutputDirectory "$env:RUNNER_TEMP/collector-selection" -ApplyToProcess
          # No application links are claimed here: those required inputs remain unresolved.
          ./packaging/windows/collect-installed-toolchain.ps1 -OutputDirectory "$env:RUNNER_TEMP/collection" -RustToolchain '1.99.0-x86_64-pc-windows-msvc'
      - name: Validate diagnostic JSON without environment values
        id: safe
        if: ${{ always() }}
        shell: pwsh
        run: |
          $found = $false
          foreach ($name in 'selection','probe','collector-selection','collection') {
            $public = "$env:RUNNER_TEMP/$name/public"
            if (Test-Path -LiteralPath $public) {
              python packaging/windows/validate-public-toolchain-evidence.py $public
              if ($LASTEXITCODE -ne 0) { throw 'Public diagnostic schema failure' }
              $found = $true
            }
          }
          if (-not $found) { throw 'No helper evidence was produced' }
      - name: Preserve bounded diagnostic JSON only
        if: ${{ always() && steps.safe.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-toolchain-probe-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/selection/public/*.json
            ${{ runner.temp }}/probe/public/*.json
            ${{ runner.temp }}/collector-selection/public/*.json
            ${{ runner.temp }}/collection/public/*.json
            ${{ runner.temp }}/collection/public/legal/*
