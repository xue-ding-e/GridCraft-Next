# Modified for GridCraft-Next: independent packaging identity and notices.
# Flatpak manifest for GridCraft-Next, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.xue_ding_e.gridcraft_next.yml
#   flatpak run io.github.xue_ding_e.gridcraft_next
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from io.github.xue_ding_e.gridcraft_next.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime-version and finish-args identical.
id: io.github.xue_ding_e.gridcraft_next
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gridcraft-next
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for rendering.
  - --device=dri
  # Open/Save dialogs use the file-chooser portal (rfd), and drag-and-drop uses the document
  # portal, so broad filesystem access isn't needed. Documents and Downloads are granted for
  # opening workbooks by path from the command line.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Deliberately not granted: network (the optional --control channel listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network io.github.xue_ding_e.gridcraft_next` exposes it to
  # host agents) and home/host filesystem access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: gridcraft-next
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/gridcraft-next/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p gridcraft -p gridcraft-cli
      - install -Dm755 target/release/gridcraft /app/bin/gridcraft-next
      - install -Dm755 target/release/gridcraft-cli /app/bin/gridcraft-next-cli
      - install -Dm644 packaging/linux/io.github.xue_ding_e.gridcraft_next.desktop /app/share/applications/io.github.xue_ding_e.gridcraft_next.desktop
      - install -Dm644 packaging/linux/io.github.xue_ding_e.gridcraft_next.mime.xml /app/share/mime/packages/io.github.xue_ding_e.gridcraft_next.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.xue_ding_e.gridcraft_next.metainfo.xml.in > /app/share/metainfo/io.github.xue_ding_e.gridcraft_next.metainfo.xml
      # Carry the project notices and asset terms in from-source builds too.
      - >-
        set -eu;
        install -d /app/share/doc/gridcraft-next;
        install -m644 LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md /app/share/doc/gridcraft-next/;
        for f in README.md LICENSE COPYRIGHT; do
          if [ -f "$f" ]; then install -m644 "$f" /app/share/doc/gridcraft-next/; fi;
        done;
        install -m644 assets/app-icon/LICENSE.txt /app/share/doc/gridcraft-next/app-icon-LICENSE.txt;
        install -m644 docs/brand/LICENSE-brand.txt /app/share/doc/gridcraft-next/LICENSE-brand.txt;
        if [ -n "${CRAFT_FONTS_DIR:-}" ]; then
          for f in "$CRAFT_FONTS_DIR"/fonts/*/OFL.txt; do
            if [ -f "$f" ]; then install -m644 "$f" "/app/share/doc/gridcraft-next/OFL-$(basename "$(dirname "$f")").txt"; fi;
          done;
        fi
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - target-xtask
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
